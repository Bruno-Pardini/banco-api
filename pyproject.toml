[project]
name = "banco-api"
version = "1.0.0"
description = "API del proceso PR06B · Procesamiento de Transacciones Bancarias (Banco E6) · Hotel Resort Sierra Madre"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "anyio>=4.6", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
